<style>
:root{--bg:#EDF0F4;--sheet:#FFFFFF;--ink:#18212E;--muted:#5A6577;--rule:#D3DAE4;--accent:#2C4A8C;--accent-ink:#FFFFFF;--red:#B42F27}
@media (prefers-color-scheme: dark){:root{--bg:#0F141B;--sheet:#171E28;--ink:#E4E9F0;--muted:#9AA6B6;--rule:#2C3644;--accent:#9DB4FF;--accent-ink:#0F141B;--red:#FF8B7B;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
form{width:100%;max-width:380px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:24px;display:grid;gap:14px}
h1{margin:0;font:700 24px/1.2 Georgia,"Times New Roman",serif}
p{margin:0;color:var(--muted);font-size:14px}
label{font-weight:600;font-size:14px}
input[type=password],input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
button{padding:11px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);font:600 16px system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{color:var(--red);font-size:14px;min-height:1.2em}
</style>

var KEY = "gutachten-trainer-pw";
function b64(s){ var b = atob(s), u = new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i] = b.charCodeAt(i); return u; }
async function open_(pw){
  var enc = new TextEncoder(), C = crypto.subtle;
  var base = await C.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
  var bits = new Uint8Array(await C.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:b64(P.salt), iterations:P.iter}, base, 512));
  var iv = b64(P.iv), data = b64(P.data), msg = new Uint8Array(iv.length + data.length); msg.set(iv); msg.set(data, iv.length);
  var mk = await C.importKey("raw", bits.slice(32), {name:"HMAC", hash:"SHA-256"}, false, ["verify"]);
  if(!(await C.verify("HMAC", mk, b64(P.mac), msg))) throw new Error("pw");
  var ak = await C.importKey("raw", bits.slice(0, 32), {name:"AES-CBC"}, false, ["decrypt"]);
  return new TextDecoder().decode(await C.decrypt({name:"AES-CBC", iv:iv}, ak, data));
}
function show(html){ document.open(); document.write(html); document.close(); }
async function tryPw(pw, remember){
  var btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; err.textContent = "";
  try{
    var html = await open_(pw);
    if(remember){ try{ localStorage.setItem(KEY, pw); }catch(e){} }
    show(html);
  }catch(e){
    try{ localStorage.removeItem(KEY); }catch(e2){}
    err.textContent = e.message === "pw" ? "Falsches Passwort. · Невірний пароль." : "Fehler beim Öffnen: Browser zu alt? · Помилка: оновіть браузер.";
    btn.disabled = false;
  }
}
document.getElementById("f").addEventListener("submit", function(e){ e.preventDefault(); tryPw(document.getElementById("pw").value, document.getElementById("keep").checked); });
(function(){ var s = null; try{ s = localStorage.getItem(KEY); }catch(e){} if(s) tryPw(s, true); })();
